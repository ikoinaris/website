<div class="home-container">
  <img src="assets/profile.png" alt="Profile Picture" class="profile-img" />
  <h1>Ioannis G. Koinaris</h1>
  <p class="typewriter">{{ currentText }}</p>
  <p class="social-media">
    <a *ngFor="let media of socialMedia" [href]="media.link" class="social-link">
      <img [src]="media.icon" [alt]="media.name" class="social-icon" />
    </a>
  </p>
</div>
