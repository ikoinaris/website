<div class="skills-container">
  <div class="expertise" *ngFor="let area of expertiseAreas">
    <div class="expertise-text">
      <h2>{{ area.name }}</h2>
    </div>
    <div class="skills-grid">
      <div class="skill-card" *ngFor="let skill of area.skills">
        <img [src]="skill.icon" [alt]="skill.name" class="skill-icon" />
        <p>{{ skill.name }}</p>
      </div>
    </div>
  </div>
</div>
